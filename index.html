<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Theodore System Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">

        <h1 class="title">
            Theodore System Dashboard
        </h1>

        <p class="subtitle">
            Real-time system monitoring
        </p>


        <!-- CPU -->

        <div class="system-item">

            <div class="system-header">
                <span>CPU</span>

                <span
                    id="cpu-value"
                    class="system-value"
                >
                    --%
                </span>
            </div>

            <div class="bar">
                <div
                    id="cpu-bar"
                    class="bar-fill"
                ></div>
            </div>

        </div>


        <!-- RAM -->

        <div class="system-item">

            <div class="system-header">
                <span>RAM</span>

                <span
                    id="ram-value"
                    class="system-value"
                >
                    --%
                </span>
            </div>

            <div class="bar">
                <div
                    id="ram-bar"
                    class="bar-fill"
                ></div>
            </div>

        </div>


        <!-- STORAGE -->

        <div class="system-item">

            <div class="system-header">
                <span>Storage</span>

                <span
                    id="storage-value"
                    class="system-value"
                >
                    --%
                </span>
            </div>

            <div class="bar">
                <div
                    id="storage-bar"
                    class="bar-fill"
                ></div>
            </div>

        </div>


        <!-- NETWORK -->

        <div class="network">

            <div class="network-card">

                <div class="network-label">
                    Upload
                </div>

                <div
                    id="upload-value"
                    class="network-value"
                >
                    ↑ -- MB/s
                </div>

            </div>


            <div class="network-card">

                <div class="network-label">
                    Download
                </div>

                <div
                    id="download-value"
                    class="network-value"
                >
                    ↓ -- MB/s
                </div>

            </div>

        </div>


        <!-- STATUS -->

        <div class="footer">

            Status:

            <span
                id="status"
                class="online"
            >
                ● Connecting...
            </span>

            &nbsp; | &nbsp;

            Theodore System Dashboard

        </div>

    </main>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
